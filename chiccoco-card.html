<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chiccoco — Card Generator</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:#ede9e4;min-height:100vh;padding:16px;max-width:100%;overflow-x:hidden;}
.app-title{text-align:center;font-family:'Kanit',sans-serif;font-size:18px;font-weight:800;color:#2c2c2c;letter-spacing:6px;margin-bottom:2px;}
.app-sub{text-align:center;font-size:11px;color:#aaa;letter-spacing:2px;margin-bottom:16px;}

/* top bar */
.topbar{background:white;border-radius:12px;padding:12px 16px;margin-bottom:14px;box-shadow:0 1px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.topbar-status{font-size:12px;color:#888;flex:1;}
.topbar-status.ok{color:#5c7a6b;font-weight:700;}
.topbar-status.err{color:#cc0000;}

/* filter bar */
.filter-bar{background:white;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 8px rgba(0,0,0,.06);}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
.filter-col{flex:1;min-width:80px;}
.filter-col label{font-size:11px;color:#888;display:block;margin-bottom:3px;}
.filter-col input{width:100%;border:1.5px solid #ddd;border-radius:8px;padding:7px 10px;font-family:'Sarabun',sans-serif;font-size:13px;outline:none;}
.filter-col input:focus{border-color:#5c7a6b;}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.btn{padding:7px 14px;border:none;border-radius:8px;font-family:'Kanit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
.btn-dk{background:#3d4f47;color:white;}
.btn-gray{background:#f0f0f0;color:#555;}
.btn-red{background:#8b1a1a;color:white;}
.btn-green{background:#5c7a6b;color:white;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.sel-count{font-size:12px;color:#5c7a6b;font-weight:700;}

/* download bar */
.dl-bar{background:white;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 8px rgba(0,0,0,.06);}
.dl-bar-title{font-family:'Kanit',sans-serif;font-size:12px;font-weight:700;color:#3d4f47;margin-bottom:10px;}
.prog-bar{width:100%;height:7px;background:#eee;border-radius:4px;overflow:hidden;margin-top:8px;display:none;}
.prog-fill{height:100%;background:#5c7a6b;border-radius:4px;transition:width .3s;}
.dl-stat{font-size:12px;color:#888;margin-top:5px;}
.dl-stat.ok{color:#5c7a6b;}

/* grid layout */
#GRID { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
@media(max-width:900px){ #GRID{grid-template-columns:repeat(2,1fr);} }
@media(max-width:600px){ #GRID{grid-template-columns:1fr;} }

/* card ui list */
#GRID{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;width:100%;}
.card-ui{background:white;border-radius:14px;padding:14px;box-shadow:0 1px 8px rgba(0,0,0,.06);}
.card-ui-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.card-ui-name{font-size:12px;font-weight:700;color:#444;flex:1;margin-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-ui-code{font-size:11px;font-weight:800;color:#c8a96e;background:#f7f3ee;padding:3px 10px;border-radius:20px;flex-shrink:0;}

/* preview scale */
.card-preview{border-radius:8px;overflow:hidden;margin-bottom:10px;border:1px solid #eee;cursor:pointer;}

/* sold-out pills */
.soldout-wrap{margin:6px 0 10px;}
.soldout-title{font-size:10px;font-weight:700;color:#aaa;margin-bottom:5px;font-family:'Kanit',sans-serif;}
.soldout-pills{display:flex;flex-wrap:wrap;gap:5px;}
.soldout-pill{padding:5px 12px;border-radius:20px;cursor:pointer;background:#f0f0f0;border:1.5px solid #e0e0e0;font-size:12px;font-weight:700;font-family:'Kanit',sans-serif;color:#333;user-select:none;}
.soldout-pill.sold{background:#fee;border-color:#f5b8b8;color:#c0392b;text-decoration:line-through;}

/* price edit */
.price-edit-wrap{display:flex;align-items:center;gap:6px;margin:8px 0;}
.price-edit-wrap label{font-size:10px;font-weight:700;color:#aaa;font-family:'Kanit',sans-serif;white-space:nowrap;}
.price-edit-input{flex:1;padding:6px 8px;border:1.5px solid #e0e0e0;border-radius:7px;font-size:12px;outline:none;font-family:'Sarabun',sans-serif;}
.price-edit-input:focus{border-color:#c8a96e;}
.btn-price-apply{padding:6px 12px;background:#8b1a1a;color:white;border:none;border-radius:7px;font-family:'Kanit',sans-serif;font-size:11px;font-weight:700;cursor:pointer;}
.btn-price-reset{padding:6px 10px;background:#f5f5f5;color:#888;border:none;border-radius:7px;font-family:'Kanit',sans-serif;font-size:11px;font-weight:700;cursor:pointer;}

/* edit info panel */
.btn-edit-info{width:100%;padding:8px;background:#fff8ec;color:#a3791f;border:1.5px solid #ecd9a8;border-radius:8px;font-family:'Kanit',sans-serif;font-size:11px;font-weight:700;cursor:pointer;margin-bottom:6px;}
.edit-panel{display:none;background:#fbf9f5;border:1.5px solid #ecd9a8;border-radius:10px;padding:12px;margin-bottom:8px;}
.edit-panel.open{display:block;}
.edit-panel-row{margin-bottom:9px;}
.edit-panel-row label{font-size:10px;font-weight:700;color:#a3791f;font-family:'Kanit',sans-serif;display:block;margin-bottom:4px;}
.edit-panel-row input,.edit-panel-row textarea{width:100%;padding:7px 10px;border:1.5px solid #e6dcc4;border-radius:7px;font-size:12px;font-family:'Sarabun',sans-serif;color:#222;outline:none;}
.edit-panel-row input:focus,.edit-panel-row textarea:focus{border-color:#c8a96e;}
.edit-panel-2col{display:flex;gap:8px;}
.edit-panel-2col>div{flex:1;}
.edit-size-row{display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap;}
.edit-size-row input{padding:5px 7px;border:1.5px solid #e6dcc4;border-radius:6px;font-size:11px;outline:none;font-family:'Sarabun',sans-serif;}
.size-field{width:52px;flex-shrink:0;font-weight:700;text-align:center;}
.dim-field{width:64px;flex-shrink:0;}
.edit-size-lbl{font-size:9px;color:#bbb;display:flex;gap:5px;margin-bottom:2px;font-family:'Kanit',sans-serif;}
.edit-size-lbl span{width:52px;text-align:center;}
.edit-size-lbl span.dim-lbl{width:64px;}
.btn-del-size{background:#fee;color:#c0392b;border:none;border-radius:6px;width:22px;height:22px;font-size:12px;cursor:pointer;flex-shrink:0;line-height:1;}
.btn-add-size{padding:6px 12px;background:#eaf0ec;color:#3d6b56;border:none;border-radius:7px;font-family:'Kanit',sans-serif;font-size:11px;font-weight:700;cursor:pointer;margin-top:4px;}
.edit-panel-actions{display:flex;gap:8px;margin-top:10px;}
.btn-edit-save{flex:1;padding:8px;background:#5c7a6b;color:white;border:none;border-radius:7px;font-family:'Kanit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
.btn-edit-cancel{padding:8px 14px;background:#f0f0f0;color:#888;border:none;border-radius:7px;font-family:'Kanit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}

/* action buttons */
.btn-dl-one{width:100%;padding:8px;background:#3d4f47;color:white;border:none;border-radius:8px;font-family:'Kanit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;}

/* checkbox select */
.pi-select{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pi-select input{width:16px;height:16px;accent-color:#5c7a6b;cursor:pointer;}
.pi-select label{font-size:12px;color:#5c7a6b;font-weight:700;cursor:pointer;}

/* photo upload */
.photo-zone{border:2.5px dashed #c8b898;border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:#faf8f4;transition:all .2s;position:relative;}
.photo-zone:hover{border-color:#5c7a6b;background:#f0f5f2;}
.photo-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.photo-zone-icon{font-size:28px;margin-bottom:6px;}
.photo-zone-txt{font-size:12px;color:#888;}
.photo-zone-txt b{color:#5c7a6b;}
.photo-stat{font-size:12px;color:#5c7a6b;font-weight:700;margin-top:8px;}

/* render zone */
#RZ{position:fixed;left:-9999px;top:0;width:720px;pointer-events:none;}
</style>
</head>
<body>

<div class="app-title">chiccoco</div>
<div class="app-sub">CARD GENERATOR</div>

<div class="topbar">
  <span class="topbar-status" id="fbStatus">⏳ กำลังเชื่อมต่อ...</span>
  <button class="btn btn-green" id="btnSync" onclick="syncFromRemote()" disabled style="font-size:12px;">🔄 ซิงค์จาก Remote</button>
  <button class="btn btn-dk" id="btnLoadStorageImages" onclick="loadImagesFromStorage()" disabled style="font-size:12px;">📥 ดึงรูปจาก Storage</button>
  <button class="btn btn-dk" id="btnLoadDriveImages" onclick="loadImagesFromDrive()" disabled style="font-size:12px;">📁 ดึงรูปจาก Google Drive</button>
  <span id="syncStatus" style="font-size:11px;color:#888;"></span>
</div>

<!-- Photo Upload Section -->
<div class="filter-bar" id="photoSection" style="display:none;">
  <div class="sec-title" style="font-family:'Kanit',sans-serif;font-size:13px;font-weight:700;color:#3d4f47;margin-bottom:12px;">🖼️ อัปโหลดรูปสินค้า</div>
  <div class="photo-zone" id="photoDZ">
    <input type="file" id="photoInput" accept="image/*" multiple onchange="loadPhotos(this.files)">
    <div class="photo-zone-icon">📸</div>
    <div class="photo-zone-txt">ลากรูปมาวาง หรือคลิกเพื่อเลือก<br><b>ชื่อไฟล์ = รหัสสินค้า</b> เช่น C900.jpg, i892.png</div>
  </div>
  <div class="photo-stat" id="photoStat"></div>
</div>

<div class="filter-bar">
  <div class="filter-row">
    <div class="filter-col"><label>รหัสเริ่ม</label><input type="text" id="codeFrom" placeholder="เช่น A01"></div>
    <div class="filter-col"><label>รหัสสิ้นสุด</label><input type="text" id="codeTo" placeholder="เช่น A50"></div>
    <button class="btn btn-dk" onclick="applyFilter()">กรอง</button>
    <button class="btn btn-gray" onclick="clearFilter()">ล้าง</button>
  </div>
  <div class="toolbar">
    <button class="btn btn-gray" style="font-size:11px;padding:5px 10px;" onclick="selectAll()">✅ เลือกทั้งหมด</button>
    <button class="btn btn-gray" style="font-size:11px;padding:5px 10px;" onclick="deselectAll()">☐ ยกเลิก</button>
    <span class="sel-count" id="selCount"></span>
  </div>
</div>

<div class="dl-bar">
  <div class="dl-bar-title">📥 Download</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-green" id="btnDlSel" onclick="dlSelected()" disabled>📥 Download ที่เลือก (ZIP)</button>
    <button class="btn btn-red" id="btnDlAll" onclick="dlAll()" disabled>📥 Download ทั้งหมด (ZIP)</button>
  </div>
  <div class="prog-bar" id="progBar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="dl-stat" id="dlStat"></div>
</div>

<div id="GRID"></div>
<div id="RZ"></div>

<!-- PC Card CSS -->
<style>
.PC-card{width:720px;background:#f0ece6;font-family:'Sarabun',sans-serif;}
.PC-img{width:720px;height:720px;object-fit:cover;display:block;background:#e8e4df;}
.PC-no-img{width:720px;height:720px;background:linear-gradient(135deg,#e8e4df,#d9d4cd);display:flex;flex-direction:column;align-items:center;justify-content:center;}

<script>
const FB={apiKey:"AIzaSyBwIlvqugbNYNbFd44DtgKSZWsQrXNnSuI",authDomain:"chiccoco-live.firebaseapp.com",databaseURL:"https://chiccoco-live-default-rtdb.asia-southeast1.firebasedatabase.app",storageBucket:"chiccoco-live.firebasestorage.app"};
const DRIVE_API_KEY = 'AIzaSyBb1URl7-Y2fWVtoXEwJIto90sxYE8XkGY';
const DRIVE_FOLDER_ID = '1zHnjc3VJwqhuOrBZ1Guoq_LNSKnXpCQz';
firebase.initializeApp(FB);
const auth=firebase.auth(), db=firebase.database(), storage=firebase.storage();

let allProducts=[], productImages={}, filtered=[], selected=new Set(), shopPath='';
let photoMap={}; // code.toLowerCase() → dataURL

function setStatus(msg,ok){const el=document.getElementById('fbStatus');el.textContent=msg;el.className='topbar-status'+(ok?' ok':' err');}
function fmt(v){const n=Number(v);return isNaN(n)?v:n.toLocaleString();}

auth.onAuthStateChanged(user=>{
  if(!user){
    const em=localStorage.getItem('chiccoco_email'),pw=localStorage.getItem('chiccoco_pw');
    if(em&&pw){auth.signInWithEmailAndPassword(em,pw).catch(()=>setStatus('❌ กรุณา login จาก Remote ก่อนค่ะ',false));}
    else setStatus('❌ กรุณา login จาก Remote ก่อนค่ะ',false);
    return;
  }
  const shopId=sessionStorage.getItem('shopId')||'shop_001';
  shopPath='chiccoco/shops/'+shopId;
  setStatus('✅ เชื่อมต่อแล้วค่ะ',true);

  db.ref(shopPath+'/products').once('value',snap=>{
    const data=snap.val();
    if(!data){setStatus('⚠️ ไม่มีสต๊อกค่ะ',false);return;}
    allProducts=Object.values(data).sort((a,b)=>(a.code||'').localeCompare(b.code||''));
    setStatus('✅ เชื่อมต่อแล้ว — สต๊อก '+allProducts.length+' รายการ',true);
    document.getElementById('btnDlAll').disabled=false;
    document.getElementById('btnSync').disabled=false;
    document.getElementById('btnLoadStorageImages').disabled=false;
    document.getElementById('btnLoadDriveImages').disabled=false;
    document.getElementById('photoSection').style.display='block';
    renderGrid(allProducts);
  });

  // รูปมาจาก local upload (photoMap) ไม่ต้องโหลดจาก Firebase
  // renderGrid จะใช้ photoMap โดยตรงค่ะ
});

// ── Sync from Remote ──
let soldSizesMap={}, salePriceMap={};

function syncFromRemote(){
  const btn=document.getElementById('btnSync');
  const stat=document.getElementById('syncStatus');
  btn.disabled=true; stat.textContent='⏳ กำลังซิงค์...'; stat.style.color='#888';

  // ดึง soldSizesMap และ salePriceMap จาก Firebase
  Promise.all([
    db.ref(shopPath+'/soldSizesMap').once('value'),
    db.ref(shopPath+'/salePriceMap').once('value'),
  ]).then(([soldSnap, priceSnap])=>{
    soldSizesMap = soldSnap.val() || {};
    salePriceMap = priceSnap.val() || {};

    // อัปเดต _updated ในทุก product
    let updCount=0;
    allProducts.forEach(p=>{
      const code=p.code||'';
      const soldSizes=soldSizesMap[code]||[];
      const salePrice=salePriceMap[code]||null;

      // reset _updated แล้วใส่ข้อมูลใหม่
      if(soldSizes.length||salePrice){
        p._updated={...p, soldSizes, salePrice};
        updCount++;
      } else {
        p._updated=null;
      }
    });

    // re-render
    renderGrid(filtered.length?filtered:allProducts);

    stat.textContent='✅ ซิงค์แล้ว — อัปเดต '+updCount+' รายการ';
    stat.style.color='#5c7a6b';
    btn.disabled=false;
  }).catch(e=>{
    stat.textContent='❌ ซิงค์ไม่สำเร็จ: '+e.message;
    stat.style.color='#cc0000';
    btn.disabled=false;
  });
}

// ── ดึงรูปที่เคยอัปโหลดไว้ใน Firebase Storage (จากรีโมท) มาแปลงเป็น base64 ──
// หมายเหตุ: แปลงเป็น base64 แล้วเก็บใน photoMap เหมือนอัปโหลดมือ เพื่อให้ผ่าน html2canvas ได้ชัวร์
// ถ้ารหัสไหนติด CORS block จาก Firebase Storage bucket จะแจ้งเตือนชัดเจน ไม่ export แบบรูปหายเงียบๆ
async function loadImagesFromStorage(){
  const btn=document.getElementById('btnLoadStorageImages');
  const stat=document.getElementById('syncStatus');
  if(!storage||!shopPath){ if(stat){stat.textContent='❌ ยังไม่พร้อมค่ะ'; stat.style.color='#cc0000';} return; }
  btn.disabled=true;
  if(stat){ stat.textContent='⏳ กำลังดึงรูปจาก Storage...'; stat.style.color='#888'; }
  try{
    const shopId=sessionStorage.getItem('shopId')||'shop_001';
    const ref=storage.ref('products/'+shopId);
    const list=await ref.listAll();
    let ok=0, failCodes=[];
    await Promise.all(list.items.map(async item=>{
      const code=item.name.replace(/\.[^.]+$/,'').toLowerCase();
      try{
        const url=await item.getDownloadURL();
        const res=await fetch(url,{mode:'cors',credentials:'omit'});
        if(!res.ok) throw new Error('fetch failed');
        const blob=await res.blob();
        const dataUrl=await new Promise((resolve,reject)=>{
          const fr=new FileReader();
          fr.onload=()=>resolve(fr.result);
          fr.onerror=reject;
          fr.readAsDataURL(blob);
        });
        photoMap[code]=dataUrl;
        ok++;
      }catch(err){
        failCodes.push(code.toUpperCase());
      }
    }));
    const matched=allProducts.filter(p=>photoMap[(p.code||'').toLowerCase()]).length;
    if(stat){
      if(failCodes.length){
        stat.textContent='⚠️ ดึงได้ '+ok+' รูป · ดึงไม่ได้ '+failCodes.length+' รูป ('+failCodes.slice(0,5).join(', ')+(failCodes.length>5?' ...':'')+') กรุณาอัปโหลดรหัสเหล่านี้ด้วยมือค่ะ';
        stat.style.color='#cc7a00';
      } else {
        stat.textContent='✅ ดึงรูปจาก Storage แล้ว '+ok+' รูป · แมตช์ '+matched+'/'+allProducts.length+' รายการ';
        stat.style.color='#5c7a6b';
      }
    }
    renderGrid(filtered.length?filtered:allProducts);
  }catch(e){
    if(stat){ stat.textContent='❌ ดึงรูปไม่สำเร็จ: '+e.message; stat.style.color='#cc0000'; }
  }
  btn.disabled=false;
}

// ── ดึงรูปจากโฟลเดอร์ Google Drive (แหล่งรูปเดียวกับที่ใช้ในขั้น VRich) ──
// ใช้ Google Drive API v3 (list ไฟล์ในโฟลเดอร์ + ดาวน์โหลดแต่ละไฟล์เป็น base64)
// ไฟล์ในโฟลเดอร์ต้องแชร์เป็น "ทุกคนที่มีลิงก์ - ผู้ดู" ไม่งั้น API จะดึงไม่ได้
async function loadImagesFromDrive(){
  const btn=document.getElementById('btnLoadDriveImages');
  const stat=document.getElementById('syncStatus');
  btn.disabled=true;
  if(stat){ stat.textContent='⏳ กำลังดึงรูปจาก Google Drive...'; stat.style.color='#888'; }
  try{
    const q=encodeURIComponent("'"+DRIVE_FOLDER_ID+"' in parents and trashed = false");
    const listUrl='https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)&pageSize=1000&key='+DRIVE_API_KEY;
    const res=await fetch(listUrl);
    if(!res.ok) throw new Error('list failed '+res.status);
    const data=await res.json();
    const files=data.files||[];
    let ok=0, failCodes=[];
    await Promise.all(files.map(async f=>{
      const code=f.name.replace(/\.[^.]+$/,'').toLowerCase();
      try{
        const imgUrl='https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media&key='+DRIVE_API_KEY;
        const r2=await fetch(imgUrl);
        if(!r2.ok) throw new Error('fetch img failed');
        const blob=await r2.blob();
        const dataUrl=await new Promise((resolve,reject)=>{
          const fr=new FileReader();
          fr.onload=()=>resolve(fr.result);
          fr.onerror=reject;
          fr.readAsDataURL(blob);
        });
        photoMap[code]=dataUrl;
        ok++;
      }catch(err){
        failCodes.push(code.toUpperCase());
      }
    }));
    const matched=allProducts.filter(p=>photoMap[(p.code||'').toLowerCase()]).length;
    if(stat){
      if(failCodes.length){
        stat.textContent='⚠️ ดึงได้ '+ok+' รูป · ดึงไม่ได้ '+failCodes.length+' รูป ('+failCodes.slice(0,5).join(', ')+(failCodes.length>5?' ...':'')+')';
        stat.style.color='#cc7a00';
      } else {
        stat.textContent='✅ ดึงรูปจาก Google Drive แล้ว '+ok+' รูป · แมตช์ '+matched+'/'+allProducts.length+' รายการ';
        stat.style.color='#5c7a6b';
      }
    }
    renderGrid(filtered.length?filtered:allProducts);
  }catch(e){
    if(stat){ stat.textContent='❌ ดึงรูปจาก Drive ไม่สำเร็จ: '+e.message; stat.style.color='#cc0000'; }
  }
  btn.disabled=false;
}

// ── Photo Upload ──
function loadPhotos(files){
  const imgs=Array.from(files).filter(f=>f.type.startsWith('image/'));
  if(!imgs.length) return;
  let done=0;
  imgs.forEach(f=>{
    const key=f.name.replace(/\.[^.]+$/,'').toLowerCase().trim();
    const fr=new FileReader();
    fr.onload=ev=>{
      photoMap[key]=ev.target.result;
      done++;
      if(done===imgs.length){
        // อัปเดต productImages ด้วย local photos
        Object.keys(photoMap).forEach(k=>{
          productImages[k]=photoMap[k];
          productImages[k.toUpperCase()]=photoMap[k];
        });
        const matched=allProducts.filter(p=>photoMap[p.code.toLowerCase()]).length;
        document.getElementById('photoStat').textContent=
          'โหลดแล้ว '+imgs.length+' รูป · แมตช์กับสินค้า '+matched+'/'+allProducts.length+' รายการ';
        renderGrid(filtered.length?filtered:allProducts);
      }
    };
    fr.readAsDataURL(f);
  });
}

// drag-drop support
document.addEventListener('DOMContentLoaded',()=>{
  const dz=document.getElementById('photoDZ');

// ── Filter ──
function applyFilter(){
  const from=document.getElementById('codeFrom').value.trim().toUpperCase();
  const to=document.getElementById('codeTo').value.trim().toUpperCase();
  if(!from&&!to){renderGrid(allProducts);return;}
  renderGrid(allProducts.filter(p=>{const c=(p.code||'').toUpperCase();if(from&&to)return c>=from&&c<=to;if(from)return c>=from;if(to)return c<=to;return true;}));
}
function clearFilter(){document.getElementById('codeFrom').value='';document.getElementById('codeTo').value='';renderGrid(allProducts);}
function selectAll(){filtered.forEach(p=>selected.add(p.code));updateAllCheckboxes(true);updateCount();}
function deselectAll(){filtered.forEach(p=>selected.delete(p.code));updateAllCheckboxes(false);updateCount();}
function updateAllCheckboxes(val){filtered.forEach(p=>{const el=document.getElementById('chk-'+p.code);if(el)el.checked=val;const ui=document.getElementById('ui-'+p.code);if(ui)ui.style.borderColor=val?'#5c7a6b':'transparent';});}
function updateCount(){const n=selected.size;document.getElementById('selCount').textContent=n?n+' รายการที่เลือก':'';document.getElementById('btnDlSel').disabled=n===0;}

// ── Render Grid with full v6-style UI ──
function renderGrid(prods){
  filtered=prods;
  const grid=document.getElementById('GRID');
  grid.innerHTML='';
  if(!prods.length){grid.innerHTML='<div style="text-align:center;color:#bbb;padding:24px;font-size:13px;">ไม่พบสินค้าค่ะ</div>';updateCount();return;}

  prods.forEach((p,pi)=>{
    const wrap=document.createElement('div');
    wrap.className='card-ui'; wrap.id='ui-'+p.code;
    wrap.style.borderLeft='4px solid '+(selected.has(p.code)?'#5c7a6b':'transparent');

    // ── Checkbox select ──
    const selRow=document.createElement('div'); selRow.className='pi-select';
    const chk=document.createElement('input'); chk.type='checkbox'; chk.id='chk-'+p.code; chk.checked=selected.has(p.code);
    chk.onchange=()=>{if(chk.checked)selected.add(p.code);else selected.delete(p.code);wrap.style.borderLeftColor=chk.checked?'#5c7a6b':'transparent';updateCount();};
    const lbl=document.createElement('label'); lbl.htmlFor='chk-'+p.code; lbl.textContent='เลือก';
    selRow.append(chk,lbl);

    // ── Head ──
    const head=document.createElement('div'); head.className='card-ui-head';
    head.innerHTML=`<span class="card-ui-name">${p.name||''}</span><span class="card-ui-code">${p.code}</span>`;

    // ── Preview (scale 0.36 เหมือน v6) ──
    const prev=document.createElement('div'); prev.className='card-preview'; prev.id='prev-'+pi;
    prev.innerHTML=buildCardHTML(p);
    const inner=prev.firstElementChild;
    if(inner){
      inner.style.width='720px';
      inner.style.transform='scale(0.36)';
      inner.style.transformOrigin='top left';
      // ตั้ง height หลัง append เพื่อให้ scrollHeight ถูกต้อง
      requestAnimationFrame(()=>{
        prev.style.height=Math.round(inner.scrollHeight*0.36)+'px';
        prev.style.overflow='hidden';
      });
    }

    // ── Sold-out pills ──
    let soldWrap=null;
    if((p.type==='clothing'||!p.type)&&p.sizes&&p.sizes.length){
      soldWrap=document.createElement('div'); soldWrap.className='soldout-wrap';
      const title=document.createElement('div'); title.className='soldout-title'; title.textContent='ติ๊กไซส์ที่หมดแล้ว:';
      const pills=document.createElement('div'); pills.className='soldout-pills';
      p.sizes.forEach(s=>{
        const pill=document.createElement('div'); pill.className='soldout-pill'; pill.textContent=s.size; pill.dataset.size=s.size;
        pill.onclick=()=>{
          pill.classList.toggle('sold');
          const sold=[...pills.querySelectorAll('.soldout-pill.sold')].map(el=>el.dataset.size);
          if(!p._updated) p._updated={...p};
          p._updated.soldSizes=sold;
          const np=document.getElementById('prev-'+pi); np.innerHTML=buildCardHTML(p._updated||p);
          const ni=np.firstElementChild; if(ni){ni.style.transform='scale(0.36)';ni.style.transformOrigin='top left';np.style.height=Math.round(ni.scrollHeight*0.36)+'px';}
        };
        pills.appendChild(pill);
      });
      soldWrap.append(title,pills);
    }

    // ── Price edit ──
    const priceWrap=document.createElement('div'); priceWrap.className='price-edit-wrap';
    const pLbl=document.createElement('label'); pLbl.textContent='ราคาใหม่:';
    const pInp=document.createElement('input'); pInp.className='price-edit-input'; pInp.type='number'; pInp.placeholder='เดิม '+fmt(p.price);
    const pApply=document.createElement('button'); pApply.className='btn-price-apply'; pApply.textContent='ลดราคา';
    const pReset=document.createElement('button'); pReset.className='btn-price-reset'; pReset.textContent='รีเซ็ต';
    pApply.onclick=()=>{if(!pInp.value.trim())return;if(!p._updated)p._updated={...p};p._updated.salePrice=pInp.value.trim();refreshPreview(pi,p);};
    pReset.onclick=()=>{pInp.value='';if(p._updated)delete p._updated.salePrice;refreshPreview(pi,p);};
    priceWrap.append(pLbl,pInp,pApply,pReset);

    // ── Edit info panel (v6 style) ──
    const btnEdit=document.createElement('button'); btnEdit.className='btn-edit-info'; btnEdit.textContent='✏️ แก้ไขข้อมูลสินค้า';
    const editPanel=document.createElement('div'); editPanel.className='edit-panel'; editPanel.id='ep-'+pi;
    btnEdit.onclick=()=>{
      const isOpen=editPanel.classList.contains('open');
      if(isOpen){editPanel.classList.remove('open');editPanel.innerHTML='';return;}
      const co=p.activeCols||[];
      const sizesArr=(p._updated||p).sizes||[];
      let sizeEditor='';
      if(co.length){
        const lblRow=`<div class="edit-size-lbl"><span>ไซส์</span>${co.map(c=>'<span class="dim-lbl">'+c+'</span>').join('')}</div>`;
        const rows=sizesArr.map((s,si)=>`<div class="edit-size-row" data-si="${si}"><input class="size-field" data-field="size" value="${s.size||''}">${co.map(c=>'<input class="dim-field" data-field="'+c+'" value="'+(s[c]||'')+'">').join('')}<button class="btn-del-size" data-del="${si}">✕</button></div>`).join('');
        sizeEditor=`<div class="edit-size-lbl" style="font-size:10px;font-weight:700;color:#a3791f;font-family:'Kanit',sans-serif;margin-top:8px;margin-bottom:4px;">ตารางไซส์</div>${lblRow}<div id="srows-${pi}">${rows}</div><button class="btn-add-size" id="addsz-${pi}">+ เพิ่มไซส์</button>`;
      }
      editPanel.innerHTML=`
        <div class="edit-panel-row"><label>ชื่อสินค้า</label><textarea id="en-${pi}" rows="2">${p.name||''}</textarea></div>
        <div class="edit-panel-2col">
          <div class="edit-panel-row"><label>สี</label><input type="text" id="ec-${pi}" value="${p.color||''}"></div>
          <div class="edit-panel-row"><label>ราคา</label><input type="text" id="ep2-${pi}" value="${p.price||''}"></div>
        </div>
        ${sizeEditor}
        <div class="edit-panel-actions">
          <button class="btn-edit-save" id="esave-${pi}">✓ บันทึก</button>
          <button class="btn-edit-cancel" id="ecancel-${pi}">ยกเลิก</button>
        </div>`;
      editPanel.classList.add('open');
      // wire
      const addSzBtn=document.getElementById('addsz-'+pi);
      if(addSzBtn) addSzBtn.onclick=()=>{
        const rw=document.getElementById('srows-'+pi); const div=document.createElement('div'); div.className='edit-size-row';
        div.innerHTML=`<input class="size-field" data-field="size" value="">${co.map(c=>'<input class="dim-field" data-field="'+c+'" value="">').join('')}<button class="btn-del-size">✕</button>`;
        div.querySelector('.btn-del-size').onclick=()=>div.remove(); rw.appendChild(div);
      };
      editPanel.querySelectorAll('.btn-del-size').forEach(b=>b.onclick=()=>b.closest('.edit-size-row').remove());
      document.getElementById('esave-'+pi).onclick=()=>{
        p.name=document.getElementById('en-'+pi).value.trim()||p.name;
        p.color=document.getElementById('ec-'+pi).value.trim();
        p.price=document.getElementById('ep2-'+pi).value.trim()||p.price;
        if(co.length){
          const rows=[...editPanel.querySelectorAll('.edit-size-row')];
          p.sizes=rows.map(r=>{const obj={};r.querySelectorAll('input').forEach(inp=>{if(inp.value.trim())obj[inp.dataset.field]=inp.value.trim();});return obj;}).filter(s=>s.size);
        }
        p._updated=null; editPanel.classList.remove('open'); editPanel.innerHTML='';
        renderGrid(filtered);
      };
      document.getElementById('ecancel-'+pi).onclick=()=>{editPanel.classList.remove('open');editPanel.innerHTML='';};
    };

    // ── Download single ──
    const btnDl=document.createElement('button'); btnDl.className='btn-dl-one';
    btnDl.textContent='⬇ บันทึก Card '+p.code+'.png';
    btnDl.onclick=()=>dlOne(p);

    wrap.append(selRow,head,prev);
    if(soldWrap) wrap.appendChild(soldWrap);
    wrap.append(priceWrap,btnEdit,editPanel,btnDl);
    grid.appendChild(wrap);
  });
  updateCount();
}

function refreshPreview(pi,p){
  const np=document.getElementById('prev-'+pi); if(!np)return;
  np.innerHTML=buildCardHTML(p._updated||p);
  const ni=np.firstElementChild;
  if(ni){
    ni.style.width='720px';
    ni.style.transform='scale(0.36)';
    ni.style.transformOrigin='top left';
    requestAnimationFrame(()=>{np.style.height=Math.round(ni.scrollHeight*0.36)+'px';np.style.overflow='hidden';});
  }
}

// ── Build Card HTML ──
function buildCardHTML(p){
  const code=p.code||'';
  // ✅ ใช้ local photoMap ก่อน (ไม่มี CORS), fallback productImages
  const imgUrl=photoMap[code.toLowerCase()]||productImages[code]||productImages[code.toUpperCase()]||productImages[code.toLowerCase()]||'';
  const imgHtml=imgUrl
    ?`<img class="PC-img" src="${imgUrl}" crossorigin="anonymous">`
    :`<div class="PC-no-img"><div class="PC-no-img-icon">📷</div><div class="PC-no-img-txt">ไม่มีรูปสินค้า</div></div>`;
  const co=p.activeCols||[];
  const av=(p.sizes||[]).filter(s=>!(p.soldSizes||[]).includes(s.size));
  const sizeList=av.map(s=>s.size).filter(Boolean).join(', ')||'—';

  const priceHtml=p.salePrice
    ?`<div class="PC-box"><div class="PC-lbl">ราคา</div><div class="PC-val price-orig">${fmt(p.price)}</div><div class="PC-val price-new">${fmt(p.salePrice)}</div></div>`
    :`<div class="PC-box"><div class="PC-lbl">ราคา</div><div class="PC-val price">${fmt(p.price)}</div></div>`;

  let tableHtml='';
  if(co.length&&av.length){
    const heads=co.map(c=>`<th>${c}</th>`).join('');
    const rows=av.map(s=>`<tr><td class="sz">${s.size}</td>${co.map(c=>`<td>${s[c]||'—'}</td>`).join('')}</tr>`).join('');
    tableHtml=`<table class="PC-table"><thead><tr><th>ไซส์</th>${heads}</tr></thead><tbody>${rows}</tbody></table>`;
  }

  const colorHtml=p.color?`<div class="PC-info"><div class="PC-lbl">สี</div><div style="font-size:34px;font-weight:700;color:#2c2c2c;">${p.color}</div></div>`:'';
  const matHtml=p.material?`<div class="PC-info"><div class="PC-lbl">วัสดุ</div><div style="font-size:26px;font-weight:700;color:#2c2c2c;">${p.material}</div></div>`:'';

  return `<div class="PC-card">
    ${imgHtml}
    <div class="PC-body">
      <div class="PC-brand">C H I C C O C O</div>
      <div class="PC-name">${p.name||''}</div>
      <div class="PC-row">
        <div class="PC-box"><div class="PC-lbl">รหัสสินค้า</div><div class="PC-val">${code}</div></div>
        ${priceHtml}
      </div>
      <div class="PC-box" style="text-align:center;"><div class="PC-lbl">ไซส์ที่มี</div><div style="font-size:36px;font-weight:800;color:#3d4f47;font-family:'Kanit',sans-serif;">${sizeList}</div></div>
      ${colorHtml}${matHtml}
      ${tableHtml}
      <div class="PC-footer">Chiccoco Live @ 2025</div>
    </div>
  </div>`;
}

// ── Canvas render (fetch base64 ก่อน เพื่อแก้ CORS ตอน download) ──
async function fetchBase64(url){
  try{
    const res=await fetch(url,{mode:'cors',credentials:'omit'});
    if(!res.ok) return url;
    const blob=await res.blob();
    return await new Promise(resolve=>{
      const fr=new FileReader(); fr.onload=()=>resolve(fr.result); fr.onerror=()=>resolve(url); fr.readAsDataURL(blob);
    });
  }catch(e){ return url; }
}

async function toCanvas(p){
  const target=p._updated||p;
  const code=target.code||'';
  // ✅ ใช้ local photoMap ก่อน (ไม่มี CORS), fallback productImages
  const imgUrl=photoMap[code.toLowerCase()]||productImages[code]||productImages[code.toUpperCase()]||productImages[code.toLowerCase()]||'';

  // photoMap เป็น base64 อยู่แล้ว ไม่ต้อง fetch เพิ่ม

  const rz=document.getElementById('RZ');
  rz.innerHTML=buildCardHTML(target);
  const el=rz.firstElementChild;

  const img=el.querySelector('img.PC-img');
  if(img) await new Promise(res=>{if(img.complete&&img.naturalHeight>0){res();return;}img.onload=res;img.onerror=res;});
  await document.fonts.ready;
  await new Promise(r=>setTimeout(r,200));

  const cv=await html2canvas(el,{scale:2,backgroundColor:'#f0ece6',useCORS:true,allowTaint:false,width:720,logging:false});
  rz.innerHTML='';

  return cv;
}

async function dlOne(p){
  const cv=await toCanvas(p);
  const a=document.createElement('a'); a.download='card_'+p.code+'.png'; a.href=cv.toDataURL('image/png'); a.click();
}

async function dlSelected(){
  const prods=[...selected].map(c=>allProducts.find(p=>p.code===c)).filter(Boolean);
  if(!prods.length)return; await runDl(prods);
}
async function dlAll(){
  const list=filtered.length?filtered:allProducts;
  if(!confirm('Download '+list.length+' รายการ?'))return; await runDl(list);
}

async function runDl(prods){
  document.getElementById('progBar').style.display='block';
  const fill=document.getElementById('progFill'), stat=document.getElementById('dlStat');
  stat.textContent='กำลังเตรียม...'; stat.className='dl-stat';
  const zip=new JSZip(); let done=0;
  for(const p of prods){
    try{stat.textContent=`สร้าง ${p.code} (${done+1}/${prods.length})...`;const cv=await toCanvas(p);const blob=await new Promise(res=>cv.toBlob(res,'image/png'));zip.file('card_'+p.code+'.png',blob);}catch(e){console.error(p.code,e);}
    done++; fill.style.width=(done/prods.length*100)+'%';
  }
  const zipBlob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(zipBlob); a.download='chiccoco-cards.zip'; a.click();
  stat.textContent='✅ Download สำเร็จ '+done+' รายการค่ะ'; stat.className='dl-stat ok';
  setTimeout(()=>document.getElementById('progBar').style.display='none',4000);
}
